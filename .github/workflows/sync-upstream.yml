name: Auto Sync Fork Upstream
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set git user
        run: |
          git config --global user.name "Sync Bot"
          git config --global user.email "sync-bot@github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/TheNetsky/Microsoft-Rewards-Script.git

      - name: Fetch & Merge upstream
        run: |
          git fetch upstream
          git checkout v4
          git merge upstream/v4 -X theirs
          git push origin v4
